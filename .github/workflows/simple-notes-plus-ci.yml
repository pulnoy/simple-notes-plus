name: Simple Notes+ APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testStandardDebugUnitTest --no-daemon --stacktrace

      - name: Build test APK
        working-directory: android
        run: ./gradlew assembleStandardDebug --no-daemon --stacktrace

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-notes-plus-debug
          path: android/app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error
          retention-days: 14
